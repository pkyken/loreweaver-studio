name: One-shot Prettier repair

on:
  push:
    branches:
      - i18n/japanese-localization

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/japanese-localization
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Apply Prettier
        run: bunx prettier --write src/i18n/i18n.test.ts src/i18n/locales/ja.json
      - name: Commit the repair and remove this helper
        run: |
          rm .github/workflows/one-shot-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/i18n/i18n.test.ts src/i18n/locales/ja.json .github/workflows/one-shot-format.yml
          git commit -m "style: apply Prettier to Japanese locale"
          git push origin HEAD:i18n/japanese-localization
