name: Verify Japanese Studio branch

on:
  push:
    branches:
      - i18n/japanese-complete
    paths:
      - .github/workflows/materialize-ja-catalog.yml

permissions:
  contents: read

jobs:
  web:
    name: Web localization verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/japanese-complete
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bun run i18n:lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
